# Builds the documentation site from all six repositories and publishes it on GitHub Pages.
#
# The playbook reads the repositories as sibling folders, so this job checks them out side by
# side, the same layout as D:\dev\workspace\ff-logistic. All six are public: no token needed.
#
# Runs on a push to main here, by hand, and every night, which picks up documentation changes
# in the other repositories (they cannot start this workflow without a token of their own).
# A pull request builds the site, with warnings as failures, and deploys nothing.
#
# Once, in this repository's settings: Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'     # 02:17 UTC, 05:17 in Istanbul

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits instead of cancelling one that is publishing.
# A pull request's check runs in a group of its own and does not wait for deployments.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: docs
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-runtime
          path: runtime
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-base
          path: base
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-shared
          path: shared
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-modulith
          path: modulith
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-services
          path: services
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build the site
        working-directory: docs
        run: ./build.sh --log-failure-level=warn
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/build/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
