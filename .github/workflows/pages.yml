# Builds the documentation site from all six repositories and publishes it on GitHub Pages.
#
# The playbook reads the repositories as sibling folders, so this job checks them out side by
# side, the same layout as D:\dev\workspace\ff-logistic. All six are public: no token needed.
#
# Runs on a push to main here, by hand, and (from S2) when another repository's CI reports a
# documentation change with a repository_dispatch of type docs-changed.
#
# Once, in this repository's settings: Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [docs-changed]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits instead of cancelling one that is publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: docs
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-runtime
          path: runtime
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-base
          path: base
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-shared
          path: shared
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-modulith
          path: modulith
      - uses: actions/checkout@v6
        with:
          repository: ffetih/ff-logistic-services
          path: services
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Build the site
        working-directory: docs
        run: ./build.sh --log-failure-level=warn
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
