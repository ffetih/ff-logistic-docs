# The documentation site: this hub and one component per repository.
#
#   ./build.sh            builds into build/site
#
# Diagrams (Mermaid here, PlantUML in the components) are rendered by Kroki: the pages link
# to the image on the Kroki server, so the build needs no network, and a reader does.
site:
  title: FF Logistic
  url: https://ffetih.github.io/ff-logistic-docs
  start_page: ff-logistic::index.adoc

content:
  # The six repositories side by side, as they are checked out locally (D:\dev\workspace\ff-logistic)
  # and in the Pages workflow. HEAD is each folder's working tree: unsaved-to-Git changes show up
  # in a local build. The edit links point at GitHub.
  sources:
    - url: .
      branches: HEAD
      edit_url: 'https://github.com/ffetih/ff-logistic-docs/edit/main/{path}'
    - url: ../runtime
      branches: HEAD
      start_path: docs
      edit_url: 'https://github.com/ffetih/ff-logistic-runtime/edit/main/{path}'
    - url: ../base
      branches: HEAD
      start_path: docs
      edit_url: 'https://github.com/ffetih/ff-logistic-base/edit/main/{path}'
    - url: ../shared
      branches: HEAD
      start_path: docs
      edit_url: 'https://github.com/ffetih/ff-logistic-shared/edit/main/{path}'
    - url: ../modulith
      branches: HEAD
      start_path: docs
      edit_url: 'https://github.com/ffetih/ff-logistic-modulith/edit/main/{path}'
    - url: ../services
      branches: HEAD
      start_path: docs
      edit_url: 'https://github.com/ffetih/ff-logistic-services/edit/main/{path}'

asciidoc:
  attributes:
    kroki-server-url: https://kroki.io
    experimental: ''
    page-pagination: ''
  extensions:
    - asciidoctor-kroki

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  # Our own header and footer over the default UI's sample ones.
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site
